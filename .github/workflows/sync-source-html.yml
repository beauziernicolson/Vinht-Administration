name: Sync VinHT source HTML compatibility

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-source-html.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync/exact-web-clone
          fetch-depth: 0
      - name: Restore source HTML demo compatibility script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          changed=0
          for p in Path('.').rglob('*.html'):
              text=p.read_text('utf-8')
              if 'market-demo-standalone.js' in text:
                  continue
              m=re.search(r'<script type="module" src="([^"\n]*js/main\.js)"></script>', text)
              if not m:
                  continue
              main_src=m.group(1)
              prefix=main_src[:-len('js/main.js')]
              tag=f'<script src="{prefix}js/demo/market-demo-standalone.js"></script>\n  '
              text=text[:m.start()]+tag+text[m.start():]
              p.write_text(text,'utf-8')
              changed+=1
          print(f'updated {changed} HTML files')
          PY
          git config user.name 'VinHT Source Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add '*.html' 'admin/*.html' 'agent/*.html' 'courier/*.html' 'merchant/*.html' 2>/dev/null || true
          git commit -m 'sync(web): restore source HTML compatibility scripts' || true
          git push origin HEAD:sync/exact-web-clone
