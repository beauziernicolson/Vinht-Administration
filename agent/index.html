<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Centre Agent — VinHT</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="../styles.css">  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head><body class="portal-theme-merchant" data-agent-page="center">
  <div class="vinht-site-loader" id="vinhtSiteLoader" role="status" aria-live="polite" aria-label="Chargement de VinHT">
    <div class="vinht-loader-glass"><span class="vinht-loader-ring" aria-hidden="true"></span><strong>VinHT</strong><small>Chargement…</small></div>
  </div><header class="portal-global-topbar"><div class="portal-global-inner">

<nav class="portal-global-actions" aria-label="Actions VinHT"><a href="../help.html" aria-label="Aide"><i data-lucide="circle-help"></i></a><a href="../account.html" aria-label="Compte"><i data-lucide="user-round"></i></a></nav>
